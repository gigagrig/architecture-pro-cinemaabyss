name: API Tests

on:
  push:
    branches:
      - "**"
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'tests/postman/**'
      - '.github/workflows/api-tests.yml'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - 'tests/postman/**'
      - '.github/workflows/api-tests.yml'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && \
               curl -fsS http://127.0.0.1:8081/api/movies/health >/dev/null && \
               curl -fsS http://127.0.0.1:8082/api/events/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for application services..."
            sleep 10
          done

          echo "Services did not become ready in time"
          docker compose ps
          exit 1
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run API tests
        working-directory: tests/postman
        run: |
          docker build -t cinemaabyss-api-tests .
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests
      
      - name: Stop services
        if: always()
        run: docker compose down
